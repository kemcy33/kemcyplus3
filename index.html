<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffdf0b">
<meta name="description" content="Écoute GYOZA et retrouve les sons et réseaux de KEMCY+3.">
<meta property="og:title" content="KEMCY+3 — Musique & réseaux">
<meta property="og:description" content="GYOZA, les singles et les réseaux de KEMCY+3.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://kemcy33.github.io/kemcyplus3/banniere.webp">
<link rel="icon" href="profil.webp" type="image/webp">
<title>KEMCY+3 — Musique & réseaux</title>
<style>
:root{--ink:#20140d;--yellow:#ffdf0b;--paper:#fff4db;--red:#ef351e}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:radial-gradient(#2b190d30 1px,transparent 1.5px) 0 0/9px 9px,var(--yellow);font:1rem system-ui,sans-serif}
main{width:min(100% - 34px,810px);margin:auto;padding:24px 0 30px}
header{position:relative;padding-bottom:18px}
.banner{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px var(--ink)}
.identity{position:relative;margin:-22px 0 0 16px;display:flex;align-items:center;gap:14px}
.avatar{display:block;width:clamp(68px,15vw,105px);height:auto;border:3px solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:3px 3px var(--ink);transform:rotate(-5deg)}
h1,h2,p{margin:0}
h1,.feature h2{font-family:Impact,'Arial Black',system-ui,sans-serif;font-weight:950;letter-spacing:-.07em;line-height:1}
h1{margin-top:22px;font-size:clamp(2.3rem,8vw,4.5rem)}
h1 span{color:#a51e10}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid #751c0b;outline-offset:4px}
.feature{border:3px solid var(--ink);border-radius:19px;background:var(--paper);box-shadow:5px 5px var(--ink);padding:18px;display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
.feature p{font-weight:750;font-size:.875rem}
.feature h2{font-size:clamp(2.65rem,9vw,4.6rem)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions a,.grid a,.tracks a{min-height:46px;display:flex;align-items:center;border:2px solid var(--ink);border-radius:11px;padding:9px 13px;font-weight:800;background:var(--paper)}
.actions a:first-child{background:var(--ink);color:#fff}
.actions a:last-child{background:var(--red);color:#210e09}
a:hover{box-shadow:2px 2px var(--ink)}
section+section{margin-top:24px}
section>h2{font-size:1.17rem;margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid a{justify-content:center}
.tracks{display:grid;gap:8px}
.tracks a{justify-content:space-between;gap:10px}
.tracks span{font-size:.875rem;font-weight:600;text-align:right}
footer{text-align:center;font-weight:800;margin-top:24px}
@media(max-width:550px){main{padding-top:14px}.grid{grid-template-columns:1fr 1fr}.feature{align-items:flex-start;flex-direction:column}.identity{margin-left:10px}.banner{border-radius:15px}}
.clip-video{overflow:hidden;aspect-ratio:16/9;border:3px solid var(--ink);border-radius:19px;background:var(--ink);box-shadow:5px 5px var(--ink)}
.clip-video iframe{display:block;width:100%;height:100%;border:0}
.clip-link{display:inline-block;margin-top:12px;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.game-frame{overflow:hidden;height:clamp(480px,75vh,720px);border:3px solid var(--ink);border-radius:19px;background:var(--ink);box-shadow:5px 5px var(--ink)}
.game-frame iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<main>
<header>
<img class="banner" src="banniere.webp" alt="" fetchpriority="high">
<div class="identity"><img class="avatar" src="profil.webp" alt="" width="384" height="384"><h1>KEMCY<span>+3</span></h1></div>
</header>
<section class="feature" aria-labelledby="featured">
<div><p>À la une</p><h2 id="featured">GYOZA</h2></div>
<div class="actions">
<a href="https://open.spotify.com/search/KEMCY%20%2B3%20GYOZA" aria-label="Rechercher GYOZA sur Spotify">Spotify</a>
<a href="https://soundcloud.com/kemcy3/gyoza" aria-label="Écouter GYOZA sur SoundCloud">SoundCloud</a>
</div>
</section>
<section aria-labelledby="clip">
<h2 id="clip">Le clip</h2>
<div class="clip-video">
<iframe src="https://www.youtube-nocookie.com/embed/uRBDuoSzHzM" title="Clip de KEMCY+3 sur YouTube" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>
</div>
<a class="clip-link" href="https://youtu.be/uRBDuoSzHzM">Voir sur YouTube</a>
</section>
<section aria-labelledby="profiles">
<h2 id="profiles">Musique &amp; réseaux</h2>
<div class="grid">
<a href="https://open.spotify.com/artist/009ev21x0Q0HioE1gIUvhT">Spotify</a>
<a href="https://soundcloud.com/kemcy3">SoundCloud</a>
<a href="https://www.instagram.com/_kemcy/">Instagram</a>
<a href="https://www.youtube.com/@_KEMCY">YouTube</a>
</div>
</section>
<section aria-labelledby="game">
<h2 id="game">Le jeu GYOZA</h2>
<div class="game-frame">
<iframe src="https://s0kush.github.io/kemcy-gyoza/" title="Jouer à GYOZA" loading="lazy" allow="fullscreen" allowfullscreen></iframe>
</div>
<a class="clip-link" href="https://s0kush.github.io/kemcy-gyoza/">Ouvrir le jeu dans une page dédiée</a>
</section>
<section aria-labelledby="singles">
<h2 id="singles">Singles</h2>
<div class="tracks">
<a href="https://open.spotify.com/search/KEMCY%20%2B3%20SORRY">SORRY<span>Rechercher sur Spotify</span></a>
<a href="https://open.spotify.com/search/KEMCY%20%2B3%20CROSS">CROSS<span>Rechercher sur Spotify</span></a>
<a href="https://open.spotify.com/search/KEMCY%20%2B3%20GAME%20OVER">GAME OVER<span>Rechercher sur Spotify</span></a>
</div>
</section>
<footer>Maison de Bois</footer>
</main>
</body>
</html>
